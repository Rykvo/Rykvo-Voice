limit_conn_zone $server_name zone=rykvo_api_connections:64k;

# Forward HTTPS only from the local cloudflared transport, never a LAN header.
map $realip_remote_addr $rykvo_forwarded_scheme {
    default $scheme;
    127.0.0.1 $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;
    server_tokens off;
    autoindex off;
    # Only the local cloudflared process may supply this header.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/rykvo-voice.access.log;
    error_log /var/log/nginx/rykvo-voice.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ /\. {
        deny all;
    }
    location ~ ^/(gly/)?api/software-update/upload/chunk$ {
        client_max_body_size 1m;
        client_body_timeout 65s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $rykvo_forwarded_scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 70s;
        proxy_read_timeout 80s;
    }
    location ~ ^/(gly/)?api/v1(?:/|$) {
        limit_conn rykvo_api_connections 16;
        limit_conn_status 503;
        error_page 503 = @rykvo_api_busy;
        client_max_body_size 1600k;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $rykvo_forwarded_scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location @rykvo_api_busy {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"API_BUSY"}}';
    }
    location ~ ^/(gly/)?api/settings/network-control$ {
        client_max_body_size 8k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:38186;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $rykvo_forwarded_scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location / {
        client_max_body_size 1600k; # Each JSON API also enforces its own smaller limit.
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $rykvo_forwarded_scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
