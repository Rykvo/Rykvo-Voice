name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rykvo_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/*.test.cjs
      - run: python3 -m unittest discover -s tests
      - run: bash -n install.sh && bash -n deploy.sh && shellcheck install.sh deploy.sh
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/rykvo_ci_test?sslmode=disable
        run: go test ./... && go vet ./...
      - name: Hardware race tests
        working-directory: backend
        run: go test -race ./internal/hardware && go test -race -run 'TestModule' .
      - name: EAP packet bounds
        working-directory: backend
        run: go test ./internal/hardware -run '^$' -fuzz '^FuzzWiFiEAPPacket$' -fuzztime=20s -parallel=2
      - name: Wi-Fi transport packet bounds
        working-directory: backend
        run: go test ./internal/hardware -run '^$' -fuzz '^FuzzWiFiPacketParsers$' -fuzztime=20s -parallel=2
      - name: SIP TCP framing bounds
        working-directory: backend
        run: go test ./internal/hardware -run '^$' -fuzz '^FuzzWiFiSIPStream$' -fuzztime=20s -parallel=2
      - name: MMS PDU bounds
        working-directory: backend
        run: go test ./internal/mms -run '^$' -fuzz '^FuzzPDU$' -fuzztime=20s -parallel=2
      - name: Build both release bundles
        run: python3 deploy/build.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: rykvo-release-bundles
          path: dist/*
          if-no-files-found: error
