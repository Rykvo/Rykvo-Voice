name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rykvo_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/*.test.cjs
      - run: python3 -m unittest discover -s tests
      - name: Isolated SIP network lifecycle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wireguard-tools iptables
          sudo unshare --net python3 tests/sip_network_netns.py
      - run: bash -n install.sh && bash -n deploy.sh && shellcheck install.sh deploy.sh
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/rykvo_ci_test?sslmode=disable
        run: go test ./... && go vet ./...
      - name: Hardware race tests
        working-directory: backend
        run: go test -race ./internal/hardware && go test -race -run 'TestModule' .
      - name: IMS identity race and parser bounds
        working-directory: backend
        run: >-
          go test -race ./internal/vocat/vowifi/...
          && go test ./internal/vocat/vowifi -run '^$' -fuzz '^FuzzISIMDecoders$' -fuzztime=20s -parallel=2
      - name: EAP packet bounds
        working-directory: backend
        run: go test ./internal/hardware -run '^$' -fuzz '^FuzzWiFiEAPPacket$' -fuzztime=20s -parallel=2
      - name: Wi-Fi transport packet bounds
        working-directory: backend
        run: go test ./internal/hardware -run '^$' -fuzz '^FuzzWiFiPacketParsers$' -fuzztime=20s -parallel=2
      - name: SIP TCP framing bounds
        working-directory: backend
        run: go test ./internal/hardware -run '^$' -fuzz '^FuzzWiFiSIPStream$' -fuzztime=20s -parallel=2
      - name: Isolated IMS and MMS bearer routes
        working-directory: backend
        run: |
          go test -c ./internal/vocat/vowifi/ike -o /tmp/rykvo-ike-netns.test
          sudo unshare --net env VOCAT_NETNS_TEST=1 /tmp/rykvo-ike-netns.test -test.run 'TestLinux(UserspaceInstallerLifecycle|DataBearerRoutesAndCleanup)$'
      - name: MMS PDU bounds
        working-directory: backend
        run: go test ./internal/mms -run '^$' -fuzz '^FuzzPDU$' -fuzztime=20s -parallel=2
      - name: Build both release bundles
        run: python3 deploy/build.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: rykvo-release-bundles
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rykvo-release-bundles
          path: dist
      - name: Verify release version and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          version = pathlib.Path('VERSION').read_text().strip()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert os.environ['TAG'] == 'v' + version
          manifest = json.loads(pathlib.Path('dist/release.json').read_text())
          assert manifest['version'] == version
          assert set(manifest['assets']) == {'amd64', 'arm64'}
          for arch, info in manifest['assets'].items():
              data = pathlib.Path(f'dist/rykvo-voice-linux-{arch}.tar.gz').read_bytes()
              assert len(data) == info['size']
              assert hashlib.sha256(data).hexdigest() == info['sha256']
          PY
      - name: Publish Latest for one-click deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          dist/rykvo-voice-linux-amd64.tar.gz
          dist/rykvo-voice-linux-arm64.tar.gz
          dist/release.json
          --verify-tag --latest --title "$TAG"
          --notes-file deploy/RELEASE_NOTES.md
